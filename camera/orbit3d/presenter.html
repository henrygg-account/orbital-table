<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0d0d">
<title>Orbital Table</title>
<link rel="stylesheet" href="gg-table.css">
<style>
  /* The presenter's remote, for an iPhone held in one hand: the four modes, true scale and zoom. Served by live.py
     (http://<laptop>:8780/presenter.html on the same Wi-Fi); everything posts to /show and the table follows. */
  :root { --mint: #0ee3a6; --line: rgba(246,248,248,.14); --dim: #8a969a; --ink: #0d1113; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #0a0d0d; color: #dde3e4; font-family: var(--font-display); font-weight: 400;
    user-select: none; -webkit-user-select: none; touch-action: manipulation; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; gap: 14px; max-width: 520px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 16px); }
  .top { display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  .top .sq { width: 8px; height: 8px; background: var(--mint); }
  .top .conn { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #5c6b70; }
  .dot.on { background: var(--mint); }
  button { font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--line); background: rgba(246,248,248,.04); }
  button:active { background: rgba(246,248,248,.14); }
  .modes { flex: 1; display: grid; grid-template-rows: repeat(2, 1fr); gap: 10px; min-height: 0; }
  .mode { border-radius: 18px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 6px; padding: 0 22px; text-align: left; }
  .mode b { font-weight: 500; font-size: 26px; letter-spacing: -.01em; color: #f6f8f8; }
  .mode i { font-style: normal; font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  .mode.on { border-color: var(--mint); background: rgba(14,227,166,.10); }
  .mode.on b { color: var(--mint); }
  .row { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .card { border: 1px solid var(--line); border-radius: 18px; padding: 14px 18px; background: var(--ink); }
  .lbl { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin-bottom: 10px; }
  .lbl .v { font-family: var(--font-display); font-size: 18px; letter-spacing: 0; text-transform: none; color: #f6f8f8; font-variant-numeric: tabular-nums; }
  .toggle { width: 100%; height: 58px; border-radius: 999px; font-family: var(--font-mono); font-size: 14px; letter-spacing: .14em; text-transform: uppercase; }
  .toggle.on { border-color: #f6f8f8; color: #0a0d0d; background: #f6f8f8; }
  button:disabled, input:disabled { opacity: .3; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; background: transparent; margin: 0; }
  input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: rgba(246,248,248,.18); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 34px; height: 34px; border-radius: 50%; background: #f6f8f8; margin-top: -14px; border: 0; }
  input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: rgba(246,248,248,.18); }
  input[type=range]::-moz-range-thumb { width: 34px; height: 34px; border-radius: 50%; background: #f6f8f8; border: 0; }
  .ends { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  .note { font-size: 13px; color: var(--dim); min-height: 1.2em; }
  .recal { height: 50px; font-size: 12px; color: var(--dim); }
  .recal.arm { border-color: #f6f8f8; color: #f6f8f8; }
  .recal.busy { opacity: .5; }
</style>
</head>
<body>
<div class="top"><span class="sq"></span>Orbital table<span class="conn"><span class="dot" id="dot"></span><span id="conn">Connecting</span></span></div>
<div class="modes" id="modes"></div>
<div class="row">
  <button class="toggle" id="scale">True scale</button>
  <div class="card">
    <div class="lbl"><span>Zoom</span><span class="v" id="zv">1.0×</span></div>
    <input type="range" id="zoom" min="50" max="200" value="100" step="1" aria-label="Zoom">
    <div class="ends"><span>Wide</span><span>Close</span></div>
  </div>
  <div class="note" id="note"></div>
  <button class="toggle recal" id="recal">Recalibrate</button>
  <div class="note" id="rnote"></div>
</div>
<script>
const MODES = [['geo', 'LEO to GEO'], ['dro', 'LEO to DRO']];   // Capture / Defend and Competitor are set aside for now
const TRUE_OK = ['geo', 'dro'], ZOOM_OK = ['geo'];   // what the table supports in each mode
const HOST = new URLSearchParams(location.search).get('host'), BASE = HOST ? `http://${HOST}` : '';   // ?host=ip:8780 if served elsewhere
const $ = id => document.getElementById(id);
let show = { mode: 'geo', scale: 'show', zoom: 1 }, lastMsg = 0, dragging = false;

const modesEl = $('modes');
MODES.forEach(([m, t], i) => {
  const b = document.createElement('button'); b.className = 'mode'; b.dataset.m = m;
  b.innerHTML = `<i>${i + 1}</i><b>${t}</b>`; b.onclick = () => post({ mode: m }); modesEl.appendChild(b);
});
function render() {
  for (const b of modesEl.children) b.classList.toggle('on', b.dataset.m === show.mode);
  const tOk = TRUE_OK.includes(show.mode), zOk = ZOOM_OK.includes(show.mode) && !(show.scale === 'true' && tOk);
  const ts = $('scale'); ts.disabled = !tOk; ts.classList.toggle('on', show.scale === 'true' && tOk); ts.textContent = show.scale === 'true' && tOk ? 'True scale · on' : 'True scale';
  const z = $('zoom'); z.disabled = !zOk; if (!dragging) z.value = Math.round((show.zoom || 1) * 100);
  $('zv').textContent = `${(+z.value / 100).toFixed(1)}×`;
  $('note').textContent = !tOk ? 'True scale: LEO to GEO and LEO to DRO only.' : show.scale === 'true' ? 'True scale: zoom is fixed.' : show.mode === 'dro' ? 'LEO to DRO: the Earth and Moon pieces set the scale.' : !MODES.some(m => m[0] === show.mode) ? 'The table is in another mode: pick one above.' : '';
}
function post(patch) {   // optimistic: the phone answers at once; /events confirms
  show = { ...show, ...patch }; render();
  fetch(BASE + '/show', { method: 'POST', body: JSON.stringify(patch) }).then(r => r.json()).then(s => { if (!dragging) { show = s; render(); } })
    .catch(() => { $('conn').textContent = 'Not reaching the table'; });
}
$('scale').onclick = () => post({ scale: show.scale === 'true' ? 'show' : 'true' });
{ const z = $('zoom'); let last = 0, timer = 0;   // ~10 posts a second while dragging
  const send = () => { clearTimeout(timer); timer = 0; last = Date.now(); post({ zoom: +z.value / 100 }); };
  z.addEventListener('pointerdown', () => { dragging = true; }); z.addEventListener('touchstart', () => { dragging = true; }, { passive: true });
  addEventListener('pointerup', () => { dragging = false; }); addEventListener('touchend', () => { dragging = false; });
  z.oninput = () => { $('zv').textContent = `${(+z.value / 100).toFixed(1)}×`; if (Date.now() - last >= 100) send(); else if (!timer) timer = setTimeout(send, 100 - (Date.now() - last)); };
  z.onchange = () => { dragging = false; send(); }; }

// Recalibrate from the white squares on the TV's corners (live.py /calibrate_squares): tap, then tap again within 3 s.
{ const b = $('recal'), n = $('rnote'); let armed = 0, busy = false;
  const reset = () => { armed = 0; b.className = 'toggle recal'; b.textContent = 'Recalibrate'; };
  b.onclick = async () => {
    if (busy) return;
    if (!armed) { armed = setTimeout(reset, 3000); b.className = 'toggle recal arm'; b.textContent = 'Tap again: keep hands off the corners'; return; }
    clearTimeout(armed); busy = true; b.className = 'toggle recal busy'; b.textContent = 'Recalibrating'; n.textContent = '';
    try {
      const r = await (await fetch(BASE + '/calibrate_squares', { method: 'POST', body: '{}' })).json();
      n.textContent = r.ok ? `Calibrated: the screen moved ${r.moved_px} px.` : `Not calibrated: ${r.error}.`;
      n.style.color = r.ok ? 'var(--mint)' : '#e2604f';
    } catch { n.textContent = 'Not calibrated: the table did not answer.'; n.style.color = '#e2604f'; }
    busy = false; reset();
  };
}
function connect() {
  const es = new EventSource(BASE + '/events');
  es.onmessage = e => { lastMsg = Date.now(); try { const f = JSON.parse(e.data); if (f.show && !dragging) { show = f.show; render(); } } catch {} };
  es.onerror = () => {};
}
setInterval(() => { const on = Date.now() - lastMsg < 1500; $('dot').className = 'dot' + (on ? ' on' : ''); $('conn').textContent = on ? 'Live' : 'Not connected'; }, 500);
connect(); render();
</script>
</body>
</html>
