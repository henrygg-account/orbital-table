<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Presenter</title>
<link rel="stylesheet" href="gg-table.css">
<style>
  :root { --ours: #0ee3a6; --adv: #e2604f; --line: rgba(246,248,248,.14); --dim: #8a969a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: #0a0d0d; color: #dde3e4; font-family: var(--font-display); font-weight: 400; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  body { padding: 18px 28px 18px; max-width: 1180px; margin: 0 auto; }
  .eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); display: flex; align-items: center; gap: 10px; }
  .eyebrow .sq { width: 8px; height: 8px; background: var(--ours); display: inline-block; }
  .eyebrow .conn { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .eyebrow .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--gg-fog-400); }
  .eyebrow .dot.on { background: var(--ours); }
  h1 { font-weight: 500; font-size: 28px; margin: 4px 0 14px; letter-spacing: -.01em; color: #f6f8f8; }
  .grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 14px; }
  .card { border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px 18px; background: #0d1113; }
  .card h2 { font-family: var(--font-mono); font-weight: 400; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 12px; color: var(--dim); }
  .modes { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: 12px; height: calc(100% - 28px); }
  button { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .14em; color: #dde3e4; cursor: pointer; border: 1px solid var(--line); background: rgba(246,248,248,.04); border-radius: 14px; }
  button:active { background: rgba(246,248,248,.14); }
  .mode { height: 100%; min-height: 84px; font-size: 17px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px; }
  .mode i { font-style: normal; font-size: 11px; color: var(--dim); }
  .mode.on, .seg button.on { border-color: #f6f8f8; color: #f6f8f8; background: rgba(246,248,248,.12); }
  .ctl { display: grid; gap: 8px; }
  .seg { display: flex; gap: 8px; }
  .seg button { flex: 1; height: 52px; font-size: 13px; border-radius: 999px; padding: 0 10px; }
  .big { height: 56px; font-size: 13px; width: 100%; border-radius: 999px; }
  .big.frz.on { border-color: var(--adv); color: var(--adv); background: rgba(226,96,79,.12); }
  .row { display: flex; gap: 12px; align-items: center; }
  .lbl { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin: 2px 0 8px; display: flex; justify-content: space-between; }
  .lbl .v { color: #f6f8f8; font-family: var(--font-display); font-size: 16px; letter-spacing: 0; text-transform: none; }
  .opt { margin-bottom: 8px; } .opt:last-child { margin-bottom: 0; }
  input[type=range] { width: 100%; height: 44px; accent-color: #dde3e4; }
  .opts { margin-top: 14px; }
  .none { color: var(--dim); font-size: 14px; }
  .status { margin-top: 14px; border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; background: #0d1113; display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .status .k { font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin-bottom: 6px; }
  .status .s { font-size: 19px; color: #f6f8f8; font-variant-numeric: tabular-nums; }
  .status .s i { font-style: normal; font-size: 11px; color: var(--dim); margin-left: 3px; }
  .foot { margin-top: 14px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; display: flex; gap: 20px; }
  .foot a { color: var(--dim); text-decoration: none; padding: 8px 0; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } .status { grid-template-columns: repeat(3, 1fr); } }
</style>
</head>
<body>
<div class="eyebrow"><span class="sq"></span>General Galactic · Orbital table<span class="conn"><span class="dot" id="dot"></span><span id="conn">Connecting</span></span></div>
<h1>Presenter</h1>

<div class="grid">
  <div class="card"><h2>Mode</h2><div class="modes" id="modes"></div></div>
  <div class="card ctl">
    <div><h2>Scale</h2><div class="seg" id="scale"></div></div>
    <div><h2>Table</h2><div class="row"><button class="big frz" id="freeze" style="flex:2">Freeze pieces</button><button class="big" id="reset" style="flex:1">Reset</button></div></div>
    <div><h2>Sky</h2><div class="seg" id="sky"></div></div>
  </div>
</div>

<div class="card opts"><h2 id="opts-h">Options</h2><div id="opts"></div></div>

<div class="status">
  <div><div class="k">Table shows</div><div class="s" id="st-mode">-</div></div>
  <div><div class="k">Scale</div><div class="s" id="st-scale">-</div></div>
  <div><div class="k">Pieces seen</div><div class="s" id="st-pieces">-</div></div>
  <div><div class="k">Detector</div><div class="s" id="st-fps">-</div></div>
  <div><div class="k">Pieces</div><div class="s" id="st-frz">-</div></div>
</div>
<div class="foot"><a href="control.html" id="adv">Advanced: engagement sim control</a></div>

<script>
// Everything here goes to live.py's /show (contract: NIGHT-AGENTS.md); the table (demo.html) applies it from the /events feed.
// ?host=<ip:port> if this page is not served by live.py itself.
const HOST = new URLSearchParams(location.search).get('host');
const BASE = HOST ? `http://${HOST}` : '';
const MODES = [['geo', 'LEO TO GEO'], ['capture', 'CAPTURE / DEFEND'], ['dro', 'LEO TO DRO'], ['competitor', 'COMPETITOR']];
const SCALES = [['show', 'Show scale'], ['true', 'True scale']];
const SKIES = [['still', 'Still'], ['slow', 'Slow'], ['off', 'Off']];

// Per-mode options, rendered from this table. type: seg (choices [value, label]) | toggle | range (min, max, step, unit);
// `when(opts)` hides a control. Values go to show.mode_opts[mode][id]; the modes read them in modes.setOpts(mode, opts).
const OPTS = {
  geo: [{ id: 'lock_geo', label: 'Satellite near GEO', type: 'seg', def: 'lock', choices: [['lock', 'Lock to GEO'], ['free', 'Free']] }],
  capture: [{ id: 'scenario', label: 'Scenario', type: 'seg', def: 'defend', choices: [['defend', 'Defend'], ['pursue', 'Pursue']] }],
  dro: [{ id: 'trail', label: 'Path', type: 'seg', def: 'full', choices: [['full', 'Full path'], ['next', 'Next burn only']] }],
  competitor: [
    { id: 'target', label: 'Target altitude', type: 'seg', def: 'GEO', choices: [['GEO', 'GEO'], ['DRO', 'DRO'], ['custom', 'Custom']] },
    { id: 'alt_km', label: 'Custom altitude', type: 'range', def: 20000, min: 500, max: 40000, step: 500, unit: 'km', when: o => o.target === 'custom' },
  ],
};

let show = { mode: 'geo', scale: 'show', freeze: false, sky: 'still', reset: 0, mode_opts: {} }, live = false, lastMsg = 0;
const $ = id => document.getElementById(id);
const titleOf = m => (MODES.find(x => x[0] === m) || [0, m])[1];

function seg(el, items, cur, onPick) {
  el.innerHTML = '';
  for (const [v, t] of items) { const b = document.createElement('button'); b.textContent = t; b.className = v === cur ? 'on' : ''; b.onclick = () => onPick(v); el.appendChild(b); }
}
function post(patch) {   // optimistic: the buttons answer at once; the next /events message confirms
  fetch(BASE + '/show', { method: 'POST', body: JSON.stringify(patch) }).then(r => r.json()).then(s => { show = s; render(); }).catch(() => { $('conn').textContent = 'Not reaching live.py'; });
  const { reset, mode_opts, ...now } = patch; show = { ...show, ...now }; render();
}
const opts = () => ({ ...Object.fromEntries((OPTS[show.mode] || []).map(c => [c.id, c.def])), ...(show.mode_opts[show.mode] || {}) });
const setOpt = (id, v) => { show.mode_opts = { ...show.mode_opts, [show.mode]: { ...opts(), [id]: v } }; post({ mode_opts: { [show.mode]: { [id]: v } } }); };

let dragging = false;
function renderOpts() {
  if (dragging) return;
  const box = $('opts'), o = opts(), ctl = (OPTS[show.mode] || []).filter(c => !c.when || c.when(o));
  $('opts-h').textContent = titleOf(show.mode) + ' options';
  box.innerHTML = ctl.length ? '' : '<div class="none">No options for this mode.</div>';
  for (const c of ctl) {
    const d = document.createElement('div'); d.className = 'opt'; box.appendChild(d);
    if (c.type === 'seg') { d.innerHTML = `<div class="lbl">${c.label}</div><div class="seg"></div>`; seg(d.lastChild, c.choices, o[c.id], v => setOpt(c.id, v)); }
    else if (c.type === 'toggle') { d.innerHTML = `<div class="lbl">${c.label}</div><div class="seg"></div>`; seg(d.lastChild, [[true, 'On'], [false, 'Off']], !!o[c.id], v => setOpt(c.id, v)); }
    else if (c.type === 'range') {
      d.innerHTML = `<div class="lbl"><span>${c.label}</span><span class="v">${(+o[c.id]).toLocaleString()} ${c.unit || ''}</span></div><input type="range" min="${c.min}" max="${c.max}" step="${c.step}" value="${o[c.id]}">`;
      const r = d.querySelector('input'), out = d.querySelector('.v');
      r.oninput = () => { dragging = true; out.textContent = `${(+r.value).toLocaleString()} ${c.unit || ''}`; };
      r.onchange = () => { dragging = false; setOpt(c.id, +r.value); };
    }
  }
}
function render() {
  seg($('modes'), MODES, show.mode, v => post({ mode: v }));
  document.querySelectorAll('#modes button').forEach((b, i) => { b.className = 'mode' + (MODES[i][0] === show.mode ? ' on' : ''); b.innerHTML = `${MODES[i][1]}<i>${i + 1}</i>`; });
  seg($('scale'), SCALES, show.scale, v => post({ scale: v }));
  seg($('sky'), SKIES, show.sky, v => post({ sky: v }));
  $('freeze').className = 'big frz' + (show.freeze ? ' on' : ''); $('freeze').textContent = show.freeze ? 'Frozen: tap to release' : 'Freeze pieces';
  renderOpts();
  $('st-mode').textContent = titleOf(show.mode); $('st-scale').textContent = show.scale === 'true' ? 'True' : 'Show';
  $('st-frz').textContent = show.freeze ? 'Frozen' : 'Live'; $('st-frz').style.color = show.freeze ? 'var(--adv)' : '';
}
$('freeze').onclick = () => post({ freeze: !show.freeze });
$('reset').onclick = () => post({ reset: true });
if (HOST) $('adv').href = `http://${HOST}/control.html`;

function connect() {
  const es = new EventSource(BASE + '/events');
  es.onmessage = e => {
    const f = JSON.parse(e.data); lastMsg = Date.now();
    if (f.show) { const sig = JSON.stringify(f.show); if (sig !== connect.sig) { connect.sig = sig; show = f.show; render(); } }
    const n = Object.keys(f.pieces || {}).length;
    $('st-pieces').innerHTML = `${n}<i>${Object.keys(f.pieces || {}).map(k => k.replace('seldon-', 'S')).join(' ')}</i>`;
    $('st-fps').innerHTML = `${f.fps}<i>fps${f.idle ? ' idle' : ''}${f.calibrated ? '' : ' uncalibrated'}</i>`;
  };
  es.onerror = () => { live = false; };
}
setInterval(() => {
  live = Date.now() - lastMsg < 1500; $('dot').className = 'dot' + (live ? ' on' : ''); $('conn').textContent = live ? 'Connected to the table' : 'Not connected to live.py';
  if (!live) { $('st-pieces').textContent = '-'; $('st-fps').textContent = '-'; }
}, 500);
connect(); render();
</script>
</body>
</html>
