engagePieces();
// test hook: ?sl=o:thrust:0.3,a:fuel:20 puts those slider codes at those values
if (Q.get('sl')) for (const it of Q.get('sl').split(',')) { const [sd, id, v] = it.split(':'); modes.engSet(sd, id, v); }   // ?sl=o:thrust:0.3,s:zoom:400

if (Q.get('autostart')) setTimeout(() => fetch(`http://${location.hostname || 'localhost'}:8791/control`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{"start":true}' }).catch(() => {}), +Q.get('autostart'));   // test hook: press Start after N ms
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();

  if (k === 't' && e.shiftKey) modes.setTopo(!modes.topo);

    } else if (lifted[id]) {

// ================================================================ PRESENTER (show state) ================================================================
// The tablet (presenter.html) and the keys below post to live.py's /show; it comes back as feed.show (contract: NIGHT-AGENTS.md). Without live.py
// the keys and ?show=mode:dro,scale:true,freeze:1,sky:off apply here. Modes expose optional hooks: setMode, setScale, setOpts(mode, opts), reset.
const SHOW = { mode: null, scale: 'show', freeze: false, sky: 'still', reset: null, mode_opts: {}, play: true, t: null, zoom: 1 };   // play false: dots stop, films hold; t: scrub position (modes.seek, once per change)
window.SHOW_SKY = 'still';                                  // the sky code reads this: 'still' | 'slow' | 'off'
const showFrozen = () => SHOW.freeze;                       // frozen: feed piece updates are ignored (the tick below checks this)
const frozenEl = document.body.appendChild(Object.assign(document.createElement('div'), { className: 'mt mt-eyebrow', textContent: 'FROZEN' }));
frozenEl.style.display = 'none';
let optsSent = null;
function applyShow(s) {
  if (!s) return;
  const prev = JSON.stringify(SHOW);
  if (s.mode && s.mode !== SHOW.mode) { SHOW.mode = s.mode; optsSent = null; modes.setMode?.(s.mode); engagePieces(); }   // demo: the new mode's stand-ins
  if (s.scale && s.scale !== SHOW.scale) { SHOW.scale = s.scale; modes.setScale?.(s.scale); engagePieces(); }
  if (typeof s.zoom === 'number' && s.zoom !== SHOW.zoom) { SHOW.zoom = s.zoom; modes.setZoom?.(s.zoom); engagePieces(); }   // the presenter's zoom slider
  if (s.mode_opts) { SHOW.mode_opts = s.mode_opts; const o = s.mode_opts[SHOW.mode], j = JSON.stringify(o); if (o && j !== optsSent) { optsSent = j; modes.setOpts?.(SHOW.mode, o); } }
  if (s.reset != null) { if (SHOW.reset != null && s.reset !== SHOW.reset) modes.reset?.(); SHOW.reset = s.reset; }   // the first value seen is not a press
  if (s.freeze != null) SHOW.freeze = !!s.freeze;
  if (s.play != null && !!s.play !== SHOW.play) { SHOW.play = !!s.play; modes.setPlay?.(SHOW.play); }
  if (s.t !== undefined && s.t !== SHOW.t) { SHOW.t = s.t; if (s.t != null) modes.seek?.(s.t); }
  if (s.sky && s.sky !== SHOW.sky) { SHOW.sky = s.sky; window.SHOW_SKY = s.sky; skyDome.visible = s.sky !== 'off'; }
  if (JSON.stringify(SHOW) === prev) return;
  frozenEl.textContent = SHOW.freeze ? 'FROZEN' : 'PAUSED';
  frozenEl.style.display = SHOW.freeze || !SHOW.play ? '' : 'none';
  put(frozenEl, END === 'right' ? SW - MARG - 16 : MARG + 16, SH - 70);   // presenter's end
  frozenEl.style.transform = `translate(-50%,-50%) rotate(${END === 'right' ? -90 : 90}deg)`;
}
function postShow(patch) {                                  // live.py is the source of truth when it is there; the tablet then follows it
  if (online()) fetch('/show', { method: 'POST', body: JSON.stringify(patch) }).then(r => r.json()).then(applyShow).catch(() => applyShow(patch));
  else applyShow(patch);
}
if (Q.get('show')) { const o = {}; for (const kv of Q.get('show').split(',')) { const [k, v] = kv.split(':'); o[k] = k === 'freeze' || k === 'play' ? v === '1' : k === 't' || k === 'zoom' ? +v : v; } applyShow(o); }   // test hook
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase(), M = ['geo', 'dro'];   // CAPTURE / DEFEND and COMPETITOR are set aside for now (still ?mode=)
  if (k >= '1' && k <= String(M.length)) postShow({ mode: M[+k - 1] });
  else if (k === 't' && !e.shiftKey) postShow({ scale: SHOW.scale === 'true' ? 'show' : 'true' });
  else if (k === 'f' && !e.shiftKey) postShow({ freeze: !SHOW.freeze });
  else if (k === 'r') postShow({ reset: true });
  else if (e.key === ' ') { e.preventDefault(); postShow(SHOW.play ? { play: false } : { play: true, t: null }); }   // Space: pause / play
  else if (k === 's' && !e.shiftKey) postShow({ sky: { still: 'slow', slow: 'off', off: 'still' }[SHOW.sky] });
});
// ================================================================ /PRESENTER ================================================================

// ---------- frame ----------
let last = performance.now(), lastDraw = -1e9;
function tick(now) {
  if (PERF.fps && now - lastDraw < 1000 / PERF.fps - 4) { requestAnimationFrame(tick); return; }   // Windows: 30 fps cap
  lastDraw = now;
  const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
  const live = online();
  if (live && feed) {
    if (feed.screen_mm && (feed.screen_mm[0] !== SW || feed.screen_mm[1] !== SH)) { [SW, SH] = feed.screen_mm; layout(); }
    applyShow(feed.show);
    if (!showFrozen()) for (const k of Object.keys(ROLES)) { const p = feed.pieces?.[k]; if (p) pieces[k] = p; else if (!KEEP_DEMO) delete pieces[k]; }   // frozen: the pieces stay where they were
    if (feed.chip) pieces.chip = feed.chip;
    {   // camera: fingertips from round 4's person outlines; the hand is the one nearest the zoom track (when it is in play)
      const g = modes.handTrack(), dx = g.t1.x - g.t0.x, dy = g.t1.y - g.t0.y, L2 = dx * dx + dy * dy;
      const dist = h => { const u = Math.max(0, Math.min(1, ((h.x_mm - g.t0.x) * dx + (h.y_mm - g.t0.y) * dy) / L2)); return Math.hypot(h.x_mm - g.t0.x - dx * u, h.y_mm - g.t0.y - dy * u); };
      const h = modes.handMode && (feed.hands || []).length ? feed.hands.reduce((a, b) => dist(a) <= dist(b) ? a : b) : feed.hand;
      if (h && (!feed.hands || dist(h) < 60)) pieces.hand = { ...h, seen_ago: 0 }; else delete pieces.hand;
    }
  }
  document.getElementById('feed').style.background = live ? '#dde3e4' : '#5c6b70';
  { const t = !liveView() ? 'DEMO · DRAG PIECES · SCROLL TO ROTATE' : !live || feed.calibrated ? '' : 'UNCALIBRATED · PRESS C'; if (noteEl.textContent !== t) noteEl.textContent = t; }
  // easing toward the feed (live.py's tuning, tune.html): calm for still pieces, close-following for moving ones, which are
  // also drawn a little ahead along their velocity to make up for the camera + model delay
  const tauStill = live && feed.page_tau_s != null ? feed.page_tau_s : .09, tauMove = live && feed.page_tau_move_s != null ? feed.page_tau_move_s : tauStill;
  const lead = live && feed.page_lead_s != null ? feed.page_lead_s : 0;
  // Smoothness, in order of what matters. (1) The TV runs 29 Hz and the iGPU is shared with the detector, so more frames
  // would buy nothing there; what made motion look like 30 fps was a 18 Hz feed eased in steps. So per rendered frame:
  // (2) a dead zone: raw positions within DEADZONE mm of the held target are ignored (feed jitter never moves a piece; a
  // real move leaves the zone and the target snaps to it, then the ease below follows promptly); (3) while moving, the
  // target is dead-reckoned along the feed velocity by the time since the message (+ the camera lead), so between 18 Hz
  // messages it glides instead of stair-stepping; (4) frame-rate-independent exponential ease (1 - exp(-dt/tau)).
  const DEADZONE = 2.5, age = live ? Math.min(.12, Math.max(0, (now - feedAt) / 1000)) : 0;
  for (const [k, p] of Object.entries(pieces)) {
    if (showFrozen() && k !== 'hand' && smooth[k]) continue;                           // frozen: drawn exactly where it was (no glide or ease creeping on)
    const vx = p.vx || 0, vy = p.vy || 0, sp = Math.hypot(vx, vy), f = Math.min(1, sp / 150);   // fully "moving" from 150 mm/s
    const a = 1 - Math.exp(-dt / Math.max(.001, tauStill + (tauMove - tauStill) * f));
    const S_ = smooth[k] || (smooth[k] = { x: p.x_mm, y: p.y_mm, hx: p.x_mm, hy: p.y_mm });
    if (S_.hx === undefined) { S_.hx = p.x_mm; S_.hy = p.y_mm; }
    if (Math.hypot(p.x_mm - S_.hx, p.y_mm - S_.hy) > DEADZONE || k === 'hand' || k === 'chip' || !live) { S_.hx = p.x_mm; S_.hy = p.y_mm; }   // demo drag, the hand and the chip are not dead-zoned
    const ahead = sp > 40 ? lead + age : 0;                                            // only genuinely moving pieces are extrapolated
    S_.x += (S_.hx + vx * ahead - S_.x) * a; S_.y += (S_.hy + vy * ahead - S_.y) * a;
  }
  for (const k of Object.keys(smooth)) if (!pieces[k]) delete smooth[k];
  const held = k => pieces[k] && pieces[k].seen_ago > .6;
  const pulse = .5 + .5 * Math.sin(now / 700);

  for (const k of Object.keys(names)) {
    const P = smooth[k], el = names[k];
    el.style.display = P && TEXT === 'all' ? '' : 'none';
    if (P) { put(el, P.x, P.y + NAME_DY[k]); el.style.transform = `translate(-50%,-50%) rotate(${P.y < SH / 2 ? 180 : 0}deg)`; el.style.opacity = held(k) ? .35 : .8; }
  }
  { const P = smooth.chip; chipMesh.visible = !!P; if (P) chipMesh.position.set(P.x, -P.y, 1); }
  for (const [k, m] of Object.entries(slMeshes)) m.visible = !!smooth[k];
  const handIdle = modes.mode === 'orbits' && pieces.hand && drag !== 'hand' && !liveView();   // demo: the stand-in hand touches the table only while dragged
  if (handIdle) { const h = modes.zoomHandPos(); Object.assign(pieces.hand, { x_mm: h.x, y_mm: h.y }); smooth.hand = { x: h.x, y: h.y }; }   // otherwise it rides the knob (and the zoom can ease to a view's default)
  handMesh.visible = !!smooth.hand && !liveView() && modes.handMode; if (smooth.hand) handMesh.position.set(smooth.hand.x, -smooth.hand.y, 1.6);   // demo stand-in only
  for (const [k, P] of Object.entries(smooth)) if (k.startsWith('sl:')) slMesh(k).position.set(P.x, -P.y, 1.5);
  const view = {};
  for (const [k, P] of Object.entries(smooth)) {   // moving: the tracker says so, or the eased position is still catching up
    const p = pieces[k]; view[k] = { x_mm: P.x, y_mm: P.y, moving: !!p && (!!p.moving || Math.hypot(p.x_mm - P.x, p.y_mm - P.y) > 4) };
  }
  if (handIdle) delete view.hand;
  if (liveView() && pieces.hand) view.hand = { x_mm: pieces.hand.x_mm, y_mm: pieces.hand.y_mm };   // live: the raw fingertip, so the sliders can tell a jump from a drag

  const fig = modes.orbitsLike && modes.orbitsFigures(), TS = modes.drawsBodies;   // true scale: the modes draw Earth and the Moon, the stand-ins go
  models.earth.scale.setScalar(fig ? fig.earth / EARTH_SPHERE_R : 1); models.moon.scale.setScalar(fig ? fig.moon / MOON_SPHERE_R : 1);
  const satS = fig ? (TS ? ORB_SELDON_SCALE * .4 : ORB_SELDON_SCALE) : SELDON_SCALE;   // true scale: Earth is small, so the stand-ins shrink and keep clear of the discs

  for (const [k, r] of Object.entries(baseRings)) { const P = smooth[k]; r.visible = !!P && !fig && !(TS && (k === 'earth' || k === 'moon')); if (P) r.position.set(P.x, -P.y, 0); }
  for (const [k, g] of Object.entries(models)) {   // live: the printed Earth and Seldons stand there, so no stand-ins under them
    const P = smooth[k]; g.visible = !!P && !(TS && (k === 'earth' || k === 'moon')) && !(liveView() && (k === 'earth' || k === 'moon' || SATS.includes(k))); if (!P) continue;   // live: the printed pieces stand there

}
