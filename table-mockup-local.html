<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cislunar Ops Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Michroma&display=swap">
<style>
:root{
  /* Layout: full-bleed WebGL stage; spec plate top-left, configurator panel right (bottom sheet on phones) */
  --void:#07090c; --plate:rgba(12,16,21,.86); --edge:#2b3641; --text:#dbe4ec; --muted:#8593a1; --led:#4fd8ff;
  --f-display:"Michroma","Eurostile","Arial Narrow",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--text);font:12.5px/1.45 var(--f-mono);overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.cut{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
.plate{position:fixed;left:16px;top:calc(14px + env(safe-area-inset-top,0px));background:var(--plate);border:1px solid var(--edge);
  padding:10px 14px;max-width:min(360px,calc(100% - 32px));backdrop-filter:blur(6px)}
.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--led)}
h1{font:400 15px/1.3 var(--f-display);letter-spacing:.06em;margin:4px 0 6px;text-transform:uppercase}
.spec{color:var(--muted);font-size:11px}
.spec b{color:var(--text);font-weight:500}

#panel{position:fixed;right:16px;top:calc(14px + env(safe-area-inset-top,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));
  width:330px;display:flex;flex-direction:column;background:var(--plate);border:1px solid var(--edge);backdrop-filter:blur(8px)}
.dock{display:flex;flex-wrap:wrap;gap:4px;padding:10px;border-bottom:1px solid var(--edge)}
.opts{overflow-y:auto;padding:4px 12px 12px;display:grid;gap:12px;overscroll-behavior:contain}
.sec{font:400 12px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--led);margin:14px 0 -6px;padding-top:10px;border-top:1px solid var(--edge)}
.sec:first-of-type{border-top:0}
.grp h2{font:500 10px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
button{font:500 11px var(--f-mono);letter-spacing:.04em;color:var(--text);background:rgba(255,255,255,.03);
  border:1px solid var(--edge);padding:7px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
button:hover{border-color:#44525f}
button:focus-visible{outline:none;border-color:var(--led);box-shadow:inset 0 0 0 1px var(--led)}
button[aria-pressed="true"]{border-color:var(--led);color:#fff;background:rgba(79,216,255,.08)}
.chips button[aria-pressed="true"]{background:color-mix(in srgb,var(--led) 12%,transparent)}
button.primary{border-color:var(--led);color:var(--led);text-transform:uppercase}
button:disabled{opacity:.6;cursor:progress}
.sw{width:12px;height:12px;border-radius:50%;border:1px solid rgba(255,255,255,.25);flex:none}
.cost{color:var(--muted);font-size:10px}
.impact{border-top:1px solid var(--edge);padding:10px 12px;display:grid;gap:4px;font-size:11px}
.impact .row{display:flex;justify-content:space-between;gap:8px;color:var(--muted)}
.impact .row b{color:var(--text);font-weight:500;font-variant-numeric:tabular-nums}
.impact .tot{color:var(--text);font-weight:500}
#more{display:none}
#toast{position:fixed;left:16px;right:16px;top:50%;margin:auto;max-width:420px;background:var(--plate);border:1px solid var(--led);padding:10px 14px}
#status{position:fixed;inset:0;display:grid;place-items:center;color:var(--muted);padding:0 16px;text-align:center}

@media (max-width:760px){
  .plate{padding:8px 12px}
  .plate .spec .long{display:none}
  #panel{left:16px;right:16px;top:auto;width:auto;max-height:58%}
  #panel.collapsed .opts,#panel.collapsed .impact{display:none}
  #more{display:inline-flex}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>

const SHAPE = [

const REACH = [{ id: '0', name: 'None (frame only)' }, { id: '3', name: '3″' }, { id: '6', name: '6″' }, { id: '10', name: '10″' }];
const EDGE = [{ id: 'flat', name: 'Square' }, { id: 'chamfer', name: 'Chamfered' }, { id: 'slope', name: 'Sloped console' }, { id: 'ridge', name: 'Raised bezel' }];

const LIGHTS = [{ id: 'off', name: 'Off' }, { id: 'halo', name: 'Halo around glass', cost: 60 }, { id: 'under', name: 'Under the deck', cost: 60 }, { id: 'all', name: 'All', cost: 160 }];
const TABLE = [
  { id: 'gray',  name: 'Factory gray', sw: '#8a9096', c: 0x858b91, m: .15, r: .6 },
  { id: 'black', name: 'Black', sw: '#1a1b1d', c: 0x1a1b1d, m: .05, r: .7, cost: 250 },

const SHOWN = {
  shape: ['wedge', 'hourglass', 'floating', 'open'],
  reach: ['0', '6', '10'],
  edge: ['flat', 'chamfer', 'slope'],
  corners: ['square', 'facet'],

  accent: ['cyan', 'red', 'amber'],

const GROUPS = [
  { sec: 'Shape', key: 'shape', label: 'Body', items: SHAPE },
  { sec: 'Shape', key: 'reach', label: 'Deck reach past the table', items: REACH },
  { sec: 'Shape', key: 'edge', label: 'Deck edge', items: EDGE },

  { sec: 'Materials', key: 'trim', label: 'Trim & hardware', items: TRIM },

  { sec: 'Details', key: 'detail', label: 'Body detail', items: DETAIL },
  { sec: 'Details', key: 'lights', label: 'Light lines', items: LIGHTS },

  { sec: 'Glass & screen', key: 'glass', label: 'Glass', items: GLASSES },
  { sec: 'Glass & screen', key: 'border', label: 'Border paint', items: BORDER },
  { sec: 'Glass & screen', key: 'marks', label: 'Border graphics', items: MARKS },
  { sec: 'Glass & screen', key: 'screen', label: 'Screen', items: SCREEN },
  { sec: 'Extras', key: 'props', label: 'Earth & Moon props', items: ONOFF(30) },
  { sec: 'Extras', key: 'stand', label: 'Tablet kiosk stand', items: ONOFF(120) },
  { sec: 'Extras', key: 'vents', label: 'Vent slots (only if the heat test needs them)', items: ONOFF(0) },
  { sec: 'Extras', key: 'room', label: 'Room', items: ROOM },
];
const PRESETS_ALL = [
  { name: 'Current frame', cfg: { shape: 'open', reach: '0', edge: 'flat', corners: 'square', base: 'casters', deck: 'gunmetal', body: 'gunmetal', trim: 'alu', detail: 'plain', lights: 'off', accent: 'cyan', marks: 'plain', table: 'gray' } },
  { name: 'Command Deck', cfg: { shape: 'wedge', reach: '6', edge: 'chamfer', corners: 'facet', base: 'plinth', deck: 'gunmetal', body: 'gunmetal', trim: 'blackchrome', detail: 'greebles', lights: 'all', accent: 'cyan', marks: 'ticks' } },
  { name: "Captain's Table", cfg: { shape: 'floating', reach: '6', edge: 'flat', corners: 'square', base: 'plinth', deck: 'walnut', body: 'black', trim: 'brass', detail: 'slats', lights: 'halo', accent: 'amber', marks: 'call' } },
  { name: 'Imperial', cfg: { shape: 'hourglass', reach: '10', edge: 'slope', corners: 'facet', base: 'plinth', deck: 'carbon', body: 'white', trim: 'blackchrome', detail: 'plain', lights: 'all', accent: 'red', marks: 'call' } },

  { name: 'Research Lab', cfg: { shape: 'open', reach: '3', edge: 'chamfer', corners: 'square', base: 'casters', deck: 'oak', body: 'white', trim: 'alu', detail: 'plain', lights: 'off', accent: 'white', marks: 'plain', table: 'gray' } },
];
const PRESETS = PRESETS_ALL.filter(p => !['Rebel Workshop', 'Research Lab'].includes(p.name));
const DEFAULT = { ...PRESETS[0].cfg, glass: 'clear', border: 'black', screen: 'map', vents: 'off', props: 'on', stand: 'on', room: 'dark' };
const KEY = 'ops-table-config-v5';
let cfg = { ...DEFAULT };
try { Object.assign(cfg, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const pick = (key, id) => GROUPS.find(g => g.key === key).items.find(i => i.id === id) || GROUPS.find(g => g.key === key).items[0];
const UI_GROUPS = GROUPS.filter(g => SHOWN[g.key]).map(g => ({ ...g, items: g.items.filter(i => SHOWN[g.key].includes(i.id)) }));

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rgba = (h, a) => `rgba(${h >> 16 & 255},${h >> 8 & 255},${h & 255},${a})`;
const css = h => '#' + h.toString(16).padStart(6, '0');

// ---- Renderer / scene ----
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const portrait = () => innerWidth / innerHeight < 0.8;
const camera = new THREE.PerspectiveCamera(portrait() ? 58 : 36, innerWidth / innerHeight, 0.02, 60);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 0.25;
controls.maxDistance = 7;
controls.maxPolarAngle = 1.54;
controls.autoRotateSpeed = 0.5;

// ---- Helpers ----
const table = new THREE.Group(); // everything exported to AR
scene.add(table);
function add(geo, m, x = 0, y = 0, z = 0, parent = table) {
  const me = new THREE.Mesh(geo, m); me.position.set(x, y, z); parent.add(me); return me;
}
// box from inch dims, positioned by center (x,z) and bottom y
const ibox = (w, h, d, m, x, yb, z, p) => add(new THREE.BoxGeometry(w * IN, h * IN, d * IN), m, x * IN, (yb + h / 2) * IN, z * IN, p);
function canvasTex(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return [c, t];
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// Brushed-metal streak texture (u runs along each wall)
const brushTex = (() => {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 256;
  const g = c.getContext('2d'), r = rng(11);
  g.fillStyle = '#e6e6e6'; g.fillRect(0, 0, 1024, 256);
  for (let i = 0; i < 1400; i++) {
    const v = 200 + r() * 55 | 0; g.strokeStyle = `rgba(${v},${v},${v},${.25 + r() * .35})`;
    const y = r() * 256, x = r() * 1024; g.lineWidth = .6 + r();
    g.beginPath(); g.moveTo(x - 400, y); g.lineTo(x + 400, y); g.stroke();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(2, 2); return t;
})();

// ---- Materials ----
const phys = o => new THREE.MeshPhysicalMaterial(o);
const std = o => new THREE.MeshStandardMaterial(o);
// Perforated-sheet texture: dark round holes on a light base (tinted by the panel color)
const perfTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, 128, 128); g.fillStyle = '#050505';
  for (const [x, y] of [[32, 32], [96, 32], [0, 96], [64, 96], [128, 96]]) { g.beginPath(); g.arc(x, y, 17, 0, 7); g.fill(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; return t;
})();
// Procedural wood grain (u along the length, 1024 px = 48″; v 256 px = 12″)
const woodCache = {};
function woodTex(f) {
  if (woodCache[f.name]) return woodCache[f.name];
  const c = document.createElement('canvas'); c.width = 1024; c.height = 256;

document.fonts?.ready.then(apply);

const clock = new THREE.Clock();
let first = true;
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta(), t = clock.elapsedTime;
  if (fly) {
    fly.t = Math.min(1, fly.t + dt / 1.1);
    const e = fly.t < .5 ? 2 * fly.t * fly.t : 1 - Math.pow(-2 * fly.t + 2, 2) / 2;
    camera.position.lerpVectors(fly.from.pos, fly.to.pos, e);
    controls.target.lerpVectors(fly.from.tgt, fly.to.tgt, e);
    if (fly.t === 1) fly = null;
  }
  if (!reduceMotion) mat.led.emissiveIntensity = 2 + .25 * Math.sin(t * 1.6);
  controls.update();
  renderer.render(scene, camera);
  if (first) { first = false; document.getElementById('status').hidden = true; }
});
</script>

</html>
